<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Quiz Selection Smoke Test</title></head>
<body>
<iframe id="app" src="index.html"></iframe>
<div id="result">RUNNING</div>
<script>
  const result = document.getElementById("result");
  const frame = document.getElementById("app");

  function expect(condition, message) {
    if (!condition) throw new Error(message);
  }

  frame.addEventListener("load", () => {
    try {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      win.localStorage.removeItem("vocabBank");

      doc.getElementById("word-input").value = "first";
      doc.getElementById("def-input").value = "the first definition";
      doc.getElementById("add-btn").click();
      doc.getElementById("word-input").value = "second";
      doc.getElementById("def-input").value = "the second definition";
      doc.getElementById("add-btn").click();

      doc.getElementById("quiz-btn").click();
      expect(!doc.getElementById("quiz-select-card").classList.contains("hidden"), "quiz picker did not open");
      const choices = doc.querySelectorAll("#quiz-options input[type=checkbox]:not([disabled])");
      expect(choices.length === 2, "quiz choices were not shown");
      choices[0].click();
      doc.getElementById("start-selected-quiz-btn").click();
      expect(!doc.getElementById("quiz-card").classList.contains("hidden"), "selected quiz did not start");
      expect(doc.getElementById("quiz-progress").textContent.includes("of 1"), "single-word quiz size is incorrect");

      doc.getElementById("quit-btn").click();
      doc.getElementById("quiz-btn").click();
      doc.getElementById("select-all-quiz-btn").click();
      doc.getElementById("start-selected-quiz-btn").click();
      expect(doc.getElementById("quiz-progress").textContent.includes("of 2"), "Select All quiz size is incorrect");
      result.textContent = "PASS";
    } catch (error) {
      result.textContent = "FAIL: " + error.message;
    }
  });
</script>
</body>
</html>
